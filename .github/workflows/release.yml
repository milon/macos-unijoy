name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to bake into the package (e.g. 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build .pkg installer
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Build installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./build-installer.sh
          ./build-installer.sh

      - name: Rename artifact with version
        id: artifact
        run: |
          ARTIFACT="dist/Unijoy-Installer-${{ steps.version.outputs.version }}.pkg"
          mv dist/Unijoy-Installer.pkg "$ARTIFACT"
          echo "path=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Unijoy-Installer-${{ steps.version.outputs.version }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Unijoy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}

      - name: Bump Homebrew cask in tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'milon/homebrew-macos-unijoy' }}
          CASK_PATH: ${{ vars.HOMEBREW_CASK_PATH || 'Casks/macos-unijoy.rb' }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ -z "${TAP_PUSH_TOKEN:-}" ]]; then
            echo "::error::TAP_PUSH_TOKEN secret is empty or unset; cannot bump the tap." >&2
            echo "Set it in repo Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "TAP_PUSH_TOKEN is present (length=${#TAP_PUSH_TOKEN})"

          # The cask uses `keyboard_layout` to install unijoy.keylayout and
          # unijoy.icns directly from GitHub's auto-generated source tarball,
          # so we sha that tarball (not the .pkg).
          SRC_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG_NAME}.tar.gz"
          SRC_TARBALL="$RUNNER_TEMP/source.tar.gz"

          echo "Downloading source tarball: $SRC_URL"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 -o "$SRC_TARBALL" "$SRC_URL"; then
              break
            fi
            echo "Attempt $attempt failed; sleeping before retry..." >&2
            sleep 5
          done
          [[ -s "$SRC_TARBALL" ]] || { echo "::error::Failed to download source tarball" >&2; exit 1; }

          SHA256=$(shasum -a 256 "$SRC_TARBALL" | awk '{print $1}')
          echo "Bumping ${TAP_REPO}:${CASK_PATH} to ${VERSION} (sha256=${SHA256})"

          WORK_DIR="$RUNNER_TEMP/tap"
          rm -rf "$WORK_DIR"
          git clone --depth=1 \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/${TAP_REPO}.git" \
            "$WORK_DIR"

          CASK_FILE="$WORK_DIR/$CASK_PATH"
          if [[ ! -f "$CASK_FILE" ]]; then
            echo "::error::Cask file ${CASK_PATH} not found in ${TAP_REPO}." >&2
            echo "Make sure the tap repo has been seeded with an initial Casks/macos-unijoy.rb." >&2
            exit 1
          fi

          # Update the first version "..." and sha256 "..." lines in the cask.
          /usr/bin/sed -i '' -E \
            -e "1,/^[[:space:]]*version \"/ s|^([[:space:]]*version \").*(\")|\\1${VERSION}\\2|" \
            -e "1,/^[[:space:]]*sha256 \"/  s|^([[:space:]]*sha256 \").*(\")|\\1${SHA256}\\2|" \
            "$CASK_FILE"

          cd "$WORK_DIR"
          if git diff --quiet -- "$CASK_PATH"; then
            echo "Cask already at ${VERSION} with sha256 ${SHA256}; nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_PATH"
          git commit -m "macos-unijoy ${VERSION}"
          git push origin HEAD
